# Lingkungan pengembangan lokal. Jalankan: docker compose up -d
x-app: &app
  build:
    context: .
    target: dev
    args:
      # Xdebug mati secara bawaan agar build cepat. Untuk menyalakan:
      #   INSTALL_XDEBUG=true XDEBUG_MODE=debug docker compose up -d --build
      INSTALL_XDEBUG: ${INSTALL_XDEBUG:-false}
  image: govfac-report:dev
  volumes:
    - .:/var/www/html
  environment: &app-env
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: govfac
    DB_USERNAME: govfac
    DB_PASSWORD: secret
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    # Log ke stderr (lihat dengan: docker compose logs -f app). Berkas log di volume
    # dibuat oleh root saat `docker compose exec`, lalu tidak bisa ditulis php-fpm
    # (www-data), sehingga setiap error berubah menjadi "Permission denied".
    LOG_CHANNEL: stderr
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=90
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govfac
      POSTGRES_USER: govfac
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govfac -d govfac"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
